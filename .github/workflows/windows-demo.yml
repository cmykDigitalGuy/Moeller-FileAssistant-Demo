name: Windows offline demo build
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: demo-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and exercise installer
        shell: pwsh
        run: ./tools/Build-Windows.ps1 -TestInstaller
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moeller-FileAssistant-Demo-Windows-x64
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
